<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Het Wensbos</title>
<meta name="description" content="De verlanglijstjes van familie Annema &amp; Bos.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1424; --night:#1b1f3a; --panel:#26305a; --panel-2:#323f74;
    --paper:#f6eedc; --gold:#ffd23f; --gold-d:#c9971c; --leaf:#74c74f; --leaf-d:#3f7d35;
    --red:#e04b3a; --muted:#a9b3d6;
    --px:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);color:var(--paper);overflow:hidden}
  body{font-family:"Press Start 2P",monospace;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #world{position:fixed;inset:0;width:100vw;height:100vh}
  #iris{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

  /* ---------- Titelscherm ---------- */
  #title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:12vh;text-align:center;cursor:pointer;gap:18px}
  #title h1{font-size:clamp(28px,7.2vw,84px);line-height:1.05;color:var(--gold);letter-spacing:2px;
    text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),
      4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),
      0 10px var(--gold-d),4px 10px var(--ink),-4px 10px var(--ink),0 14px var(--ink);
    animation:bob 2.4s steps(4) infinite}
  #title h1 span{display:block;color:var(--leaf);text-shadow:inherit;
    text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),
      4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),
      0 10px var(--leaf-d),4px 10px var(--ink),-4px 10px var(--ink),0 14px var(--ink)}
  #title .sub{font-size:clamp(9px,1.6vw,15px);color:var(--paper);text-shadow:3px 3px var(--ink);margin-top:14px;letter-spacing:1px}
  #title .start{margin-top:auto;margin-bottom:22vh;font-size:clamp(11px,1.8vw,18px);color:#fff;
    text-shadow:3px 3px var(--ink);animation:blink 1s steps(1) infinite;background:none;border:0;font-family:inherit;cursor:pointer;padding:12px}
  #title .copy{position:absolute;bottom:18px;font-size:9px;color:var(--paper);opacity:.85;text-shadow:2px 2px var(--ink)}
  @keyframes blink{50%{opacity:0}}
  #title .start{animation-name:blinkSoft}
  @keyframes blinkSoft{0%,64%{opacity:1}65%,100%{opacity:.15}}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 16px;font-size:10px;pointer-events:none;text-shadow:2px 2px var(--ink)}
  #hud .stat{line-height:1.8}
  #hud .stat b{color:var(--gold);font-weight:normal}
  #sound{pointer-events:auto;font-family:inherit;font-size:10px;color:var(--paper);background:var(--panel);
    border:0;padding:8px 10px;cursor:pointer;box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 rgba(0,0,0,.35)}
  #sound:focus-visible,.hero:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  #hint{position:fixed;left:0;right:0;bottom:14px;z-index:30;text-align:center;font-size:9px;color:var(--paper);
    text-shadow:2px 2px var(--ink);pointer-events:none;transition:opacity .4s}

  /* ---------- Karakters (klikvlakken boven de canvas) ---------- */
  #heroes{position:fixed;inset:0;z-index:10;pointer-events:none}
  .hero{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;cursor:pointer;font-family:inherit}
  .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);white-space:nowrap;font-size:9px;
    color:var(--paper);background:var(--ink);padding:5px 6px 4px;box-shadow:0 0 0 2px var(--paper)}
  .hero.sel .tag,.hero:hover .tag{color:var(--ink);background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
  .hero.sel .tag::before{content:"▼";position:absolute;left:50%;top:-18px;transform:translateX(-50%);color:var(--gold);
    text-shadow:2px 2px var(--ink);animation:blink .8s steps(1) infinite}
  .bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-34px);white-space:nowrap;font-size:8px;
    color:var(--ink);background:#fff;padding:6px 7px 5px;box-shadow:0 0 0 2px var(--ink);opacity:0;transition:opacity .15s steps(2)}
  .bubble::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:6px;background:#fff;
    box-shadow:2px 2px 0 0 var(--ink);transform:translateX(-50%)}
  .bubble.on{opacity:1}

  /* ---------- Level (verlanglijst) ---------- */
  #level{position:fixed;inset:0;z-index:40;overflow-y:auto;background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 4px,transparent 4px 8px),var(--night);
    padding:22px 16px 60px}
  .wrap{max-width:760px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
  .btn{font-family:inherit;font-size:10px;color:var(--ink);background:var(--gold);border:0;padding:10px 12px 9px;cursor:pointer;
    text-decoration:none;display:inline-block;box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 var(--gold-d)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px);box-shadow:0 0 0 3px var(--ink),inset 3px 3px 0 var(--gold-d)}
  .btn.ghost{background:var(--panel-2);color:var(--paper);box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 rgba(0,0,0,.35)}
  .lvl-world{font-size:9px;color:var(--muted)}
  .head{display:flex;gap:22px;align-items:center;background:var(--panel);padding:18px;margin-bottom:28px;
    box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--paper),0 0 0 12px var(--ink)}
  .head canvas{width:100px;height:165px;flex:none;background:linear-gradient(#5b7fbf,#b8cde6 70%,var(--leaf) 70%,var(--leaf) 76%,#8b5a34 76%)}
  .head h2{font-size:clamp(18px,4vw,30px);color:var(--gold);text-shadow:3px 3px var(--ink);margin-bottom:14px;font-weight:normal}
  .head p{font-size:10px;line-height:1.9;color:var(--paper)}
  .head p b{color:var(--gold);font-weight:normal}
  .list{display:grid;gap:18px;margin-bottom:34px}
  .wish{background:var(--paper);color:var(--ink);padding:16px 16px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;
    align-items:start;box-shadow:0 0 0 4px var(--ink),inset -4px -4px 0 #d8ccb0;animation:pop .35s steps(4) both}
  .wish .ico{width:28px;height:28px;background:var(--gold);box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 var(--gold-d);
    display:grid;place-items:center;font-size:12px;grid-row:span 2}
  .wish h3{font-size:12px;line-height:1.6;font-weight:normal;word-break:break-word}
  .wish .price{font-size:11px;color:#9a6a00;white-space:nowrap;padding-top:2px}
  .wish .note{grid-column:2/4;font-size:9px;line-height:1.8;color:#5b5470;word-break:break-word}
  .wish .go{grid-column:2/4;justify-self:start;margin-top:6px}
  .wish.fav .ico{background:var(--red);color:#fff;box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 #9c2c20}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .empty{background:var(--panel);padding:26px 18px;text-align:center;font-size:10px;line-height:2;color:var(--muted);
    box-shadow:0 0 0 4px var(--ink)}
  .howto{border:3px dashed var(--muted);padding:18px;font-size:9px;line-height:2;color:var(--muted)}
  .howto strong{color:var(--paper);font-weight:normal;display:block;margin-bottom:8px;font-size:10px}
  .howto code{color:var(--gold);word-break:break-all}
  .howto .btn{margin-top:14px}

  .hud-btns{display:flex;gap:10px;pointer-events:auto}
  #who{font-family:inherit;font-size:10px;color:var(--ink);background:var(--gold);border:0;padding:8px 10px;cursor:pointer;
    box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 var(--gold-d)}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(10,8,20,.75);display:grid;place-items:center;padding:16px}
  .panel{background:var(--panel);padding:22px;width:min(420px,100%);box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--paper),0 0 0 12px var(--ink)}
  .panel h2{font-size:14px;color:var(--gold);font-weight:normal;margin-bottom:16px;text-shadow:2px 2px var(--ink)}
  .panel label{display:block;font-size:9px;color:var(--muted);margin:12px 0 6px;line-height:1.8}
  .panel input,.panel textarea{display:block;width:100%;margin-top:6px;font-family:inherit;font-size:11px;padding:10px;border:0;
    background:var(--paper);color:var(--ink);box-shadow:inset 3px 3px 0 #d8ccb0}
  .panel .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .panel .check{display:flex;gap:10px;align-items:center}
  .panel .check input{width:auto;margin:0}
  .who-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .who-pick button{font-family:inherit;font-size:10px;padding:10px;border:0;cursor:pointer;background:var(--panel-2);color:var(--paper);box-shadow:0 0 0 3px var(--ink)}
  .who-pick button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
  .err{color:#ff8a7a;font-size:9px;line-height:1.8;min-height:1em;margin-top:10px}
  .acts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
  .btn.del{font-size:9px;padding:8px 10px}
  .addform{margin-bottom:0}
  @media (max-width:560px){
    .head{flex-direction:column;text-align:center;gap:14px}
    .wish{grid-template-columns:auto 1fr}
    .wish .price{grid-column:2}
    .wish .note,.wish .go,.acts{grid-column:1/3}
    #hud{font-size:8px}
    .tag{font-size:7px;padding:4px 4px 3px}
    .bubble{font-size:7px}
  }
  @media (prefers-reduced-motion:reduce){
    #title h1,.wish{animation:none}
  }
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>

<section id="title" aria-label="Startscherm">
  <h1>HET<span>WENSBOS</span></h1>
  <p class="sub">FAMILIE ANNEMA &amp; BOS</p>
  <button class="start" id="startBtn">▶ DRUK OP START</button>
  <p class="copy">© 2026 STUDIO ANNEMA · 1 – 4 SPELERS</p>
</section>

<div id="hud" class="hidden">
  <div class="stat">WERELD <b id="wereld">1-1</b><br>CADEAUS <b id="totaal">--</b></div>
  <span class="hud-btns"><button id="who" class="hidden">▶ WIE BEN JIJ?</button><button id="sound" aria-pressed="false">♪ UIT</button></span>
</div>
<div id="heroes"></div>
<p id="hint" class="hidden">KIES EEN SPELER</p>

<section id="level" class="hidden" aria-live="polite"></section>

<div id="login" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">

    <h2 id="loginTitle">WIE BEN JIJ?</h2>
    <div class="who-pick" id="whoPick"></div>
    <div class="row"><button class="btn ghost" type="button" id="loginCancel">ANNULEER</button><button class="btn ghost hidden" type="button" id="logout">IK BEN NIEMAND HIERVAN</button></div>
  </div>
</div>

  /* ================= Sprites (16×28, chibi, naar rechts kijkend) ================= */
  function drawSprite(g, p, x, y, dir, frame, opts = {}) {
    const over = opts.color;
    const r = (lx, ly, w, h, c) => {
      g.fillStyle = over || c;
      g.fillRect(x + (dir > 0 ? lx : SW - lx - w), y + ly, w, h);
    };
    const legs = [[5,9],[4,10],[6,8]][frame] || [5,9];
    const shoe = lx => {
      if (p.shoes !== 'vans') return r(lx,26,3,2,p.shoes);
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) r(lx+i,26+j,1,1,(i + j) % 2 ? '#c8322b' : '#f4f1ea');
    };
    const sw = frame === 1 ? 1 : frame === 2 ? -1 : 0;
    // pet achterstevoren, klep naar achteren
    const scarf = () => {
      r(4,14,8,3,'#cdb88d');
      for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) if ((i + j) % 2) r(4+i,14+j,1,1,'#8f9470');
      r(9,17,2,3,'#cdb88d'); r(9,18,1,1,'#8f9470');
    };
    const cap = () => {
      r(4,0,8,3,p.cap); r(5,0,5,1,p.capH || p.cap); r(4,3,8,1,p.capD || p.cap);
      r(1,3,3,1,p.capD || p.cap); r(2,2,2,1,p.cap);
    };

    // lang haar achter het lichaam
    if (p.style === 'long') { r(2,3,4,15,p.hair); r(2,13,3,5,p.hairD); r(3,4,1,9,p.hairH); }

    if (p.coat) {
      // lange donsjas met gekruiste armen
      shoe(legs[0]); shoe(legs[1]);
      r(4,15,8,2,p.shirt); r(3,17,10,9,p.shirt);

    for (let x = -4; x < W + 4; x += 4) for (let y = groundY + 6; y < H; y += 5) {
      const n = Math.floor((x + cam) / 4) * 13 + y;
      if (hsh(n) > .7) { g.fillStyle = '#c4ab72'; g.fillRect(x - off + Math.floor(hsh(y) * 3), y, 1, 1); }
    }
    forEachInView(cam, 1, 60, (n, x) => {
      if (hsh(n + 90) > 0.6) { g.fillStyle = '#f6efe0'; g.fillRect(Math.round(x), groundY + 1, 2, 1); }
    });
  }

  function drawWorld(t, cam) {
    // lucht in banden
    const band = Math.ceil(groundY / SKY.length);
    SKY.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * band, W, band + 1); });
    // zon
    if (THEME === 'fuji') { disc(W * 0.78, groundY * 0.3, 14, '#e2574c'); disc(W * 0.78, groundY * 0.3, 12, '#ee6a5a'); }
    else { disc(W * 0.8, groundY * 0.32, 13, '#ffe9b0'); disc(W * 0.8, groundY * 0.32, 10, '#fff6d6'); }
    // wolken
    const cw = THEME === 'fuji' ? ['#f3d6dc', '#fff1f0', '#fbe6e8'] : ['#d7e1f2', '#ffffff', '#eef3fb'];
    clouds.forEach(c => {
      const x = ((c.x + t * 4 * c.s - cam * 0.05) % (W + 80) + W + 80) % (W + 80) - 40, y = c.y * (groundY / 120);
      disc(x, y + 2, 7 * c.s, cw[0]); disc(x + 9 * c.s, y, 9 * c.s, cw[1]);
      disc(x - 8 * c.s, y + 3, 6 * c.s, cw[1]); disc(x + 18 * c.s, y + 3, 6 * c.s, cw[2]);
      g.fillStyle = cw[1]; g.fillRect(x - 12 * c.s, y + 4, 34 * c.s, 4 * c.s);
    });

    if (THEME === 'bos') {
      hills(cam, '#7e98c4', 30, 10);
      forEachInView(cam, 0.28, 9, (n, x) => pine(x, groundY - 8, 16 + Math.floor(hsh(n) * 12), '#3f6a6a', '#5a8a84'));
      g.fillStyle = '#3f6a6a'; g.fillRect(0, groundY - 8, W, 8);
      forEachInView(cam, 0.55, 26, (n, x) => {
        if (hsh(n + 50) > 0.5) oak(x, groundY - 2, 9 + Math.floor(hsh(n + 7) * 5));
        else pine(x, groundY - 2, 30 + Math.floor(hsh(n + 3) * 14), '#25553a', '#3f7d4c');
      });
      forEachInView(cam, 0.85, 34, (n, x) => {
        const r = 6 + Math.floor(hsh(n + 21) * 5);
        disc(x, groundY - 1, r, '#3f8a3a'); disc(x + r, groundY, r * .8, '#3f8a3a');
        disc(x - 2, groundY - r * .6, r * .5, '#5aa94c');
      });
      grassGround(cam, ['#f2c94c', '#e85a4f']);
    } else if (THEME === 'fuji') {
      drawFuji(0.42, 0.42);
      hills(cam, '#8c86b8', 14, 6);
      forEachInView(cam, 0.28, 12, (n, x) => pine(x, groundY - 8, 10 + Math.floor(hsh(n) * 8), '#5a5f8f', '#7377a6'));
      g.fillStyle = '#5a5f8f'; g.fillRect(0, groundY - 8, W, 8);
      torii(Math.round(W * 0.12), groundY - 1);
      forEachInView(cam, 0.55, 40, (n, x) => {
        if (Math.abs(x - W * 0.12) < 18) return;
        if (hsh(n + 50) > 0.35) oak(x, groundY - 2, 8 + Math.floor(hsh(n + 7) * 5), SAKURA);
      });
      forEachInView(cam, 0.85, 46, (n, x) => {
        const r = 5 + Math.floor(hsh(n + 21) * 4);
        disc(x, groundY - 1, r, '#3f8a3a'); disc(x + r, groundY, r * .8, '#3f8a3a');
        disc(x - 2, groundY - r * .6, r * .4, '#efa3c0');
      });
      grassGround(cam, ['#fbd0e0', '#ffffff']);
    } else {
      // verre eilandjes aan de horizon, dan de zee met golf en surfers
      g.fillStyle = '#7fa6cf';
      for (let x = 0; x < W * 0.4; x++) {

      drawSea(t);

  /* ================= Helden ================= */
  const heroLayer = document.getElementById('heroes');

    heroLayer.appendChild(el);
    const h = { p, el, x: -30 - i * 22, y: 0, vy: 0, dir: 1, home: 0, target: 0, walking: false, wait: 1 + Math.random() * 2,
      bubbleT: 3 + i * 2.2 + Math.random() * 2, count: null };

    el.addEventListener('mouseenter', () => { if (state === 'play') select(i, false); });

  function updateHeroes(dt) {
    heroes.forEach(h => {
      if (h.y < 0 || h.vy) { h.vy += 420 * dt; h.y += h.vy * dt; if (h.y >= 0) { h.y = 0; h.vy = 0; } }
      if (state === 'intro') {
        h.walking = h.x < h.home - 1; h.dir = 1;
        if (h.walking) h.x = Math.min(h.home, h.x + 62 * dt);
        return;
      }
      if (state !== 'play') return;
      if (h.walking) {
        const d = h.target - h.x; h.dir = Math.sign(d) || h.dir;
        h.x += Math.sign(d) * Math.min(Math.abs(d), 18 * dt);
        if (Math.abs(d) < 0.5) { h.walking = false; h.wait = 1.5 + Math.random() * 3; }
      } else if ((h.wait -= dt) <= 0) {

        else { h.target = h.home + (Math.random() - 0.5) * W * 0.12; h.walking = true; }

  function bubbleText(h) {

    if (h.count > 0) pool.push(`${h.count} ${h.count === 1 ? 'CADEAU' : 'CADEAUS'} OP M'N LIJSTJE!`, `${h.count}× CADEAU!`);
    return pool[Math.floor(Math.random() * pool.length)];

  function drawHeroes(t) {
    heroes.forEach(h => {
      if (h.x < -20) return;
      const frame = h.y < 0 ? 1 : h.walking ? [1,0,2,0][Math.floor(t * (state === 'intro' ? 12 : 7)) % 4] : 0;
      const x = Math.round(h.x - SW / 2), y = Math.round(groundY - SH + h.y);

  /* ================= Geluid (chiptune, standaard uit) ================= */
  let ac = null, soundOn = false;
  try { soundOn = localStorage.getItem('wensbos-geluid') === 'aan'; } catch {}
  const sfx = {
    tone(f, d, when = 0, type = 'square', vol = 0.06) {
      if (!soundOn) return;
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), v = ac.createGain(), t0 = ac.currentTime + when;
      o.type = type; o.frequency.setValueAtTime(f, t0);
      v.gain.setValueAtTime(vol, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(v).connect(ac.destination); o.start(t0); o.stop(t0 + d);
    },
    blip() { this.tone(660, .07); },
    hop() { this.tone(330, .09, 0, 'square', .03); this.tone(440, .08, .05, 'square', .03); },
    coin() { this.tone(988, .08); this.tone(1319, .25, .08); },
    start() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, .14, i * .1, 'square', .05)); },
    back() { this.tone(523, .08); this.tone(392, .14, .08); },
  };
  const soundBtn = document.getElementById('sound');
  function renderSound() { soundBtn.textContent = soundOn ? '♪ AAN' : '♪ UIT'; soundBtn.setAttribute('aria-pressed', soundOn); }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; renderSound();
    try { localStorage.setItem('wensbos-geluid', soundOn ? 'aan' : 'uit'); } catch {}
    sfx.blip();
  });
  renderSound();

  /* ================= Iris-overgang ================= */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function irisTo(cx, cy, closing, ms = 650) {
    return new Promise(res => {
      if (reduce) { ig.clearRect(0, 0, iris.width, iris.height); if (closing) { ig.fillStyle = '#000'; ig.fillRect(0, 0, iris.width, iris.height); } return res(); }
      const max = Math.hypot(Math.max(cx, iris.width - cx), Math.max(cy, iris.height - cy));
      const t0 = performance.now();
      (function step(now) {
        const k = Math.min(1, (now - t0) / ms), e = closing ? 1 - k : k;
        const rad = Math.max(0, max * e);
        ig.globalCompositeOperation = 'source-over'; ig.clearRect(0, 0, iris.width, iris.height);
        ig.fillStyle = '#000'; ig.fillRect(0, 0, iris.width, iris.height);
        ig.globalCompositeOperation = 'destination-out';
        // getrapte cirkel voor het pixelgevoel
        const q = 8;
        for (let y = -rad; y <= rad; y += q) {
          const hw = Math.sqrt(Math.max(0, rad * rad - y * y));
          ig.fillRect(Math.floor((cx - hw) / q) * q, Math.floor((cy + y) / q) * q, Math.ceil(hw * 2 / q) * q + q, q);
        }
        ig.globalCompositeOperation = 'source-over';
        if (k < 1) requestAnimationFrame(step); else res();
      })(t0);
    });
  }

  /* ================= Cadeaus laden: database (Supabase) of, zonder config, de .md-bestanden ================= */
  const CFG = window.WENSBOS_DB || {};
  const DB = CFG.url && CFG.anonKey ? CFG : null;
  const wishes = {};
  let me = null; // { id } — wie je bent, alleen in deze browser bewaard
  try { me = JSON.parse(localStorage.getItem('wensbos-ik') || 'null'); } catch {}
  async function rpc(fn, args = {}) {
    const res = await fetch(`${DB.url}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      // oude anon keys (eyJ…) ook als Bearer; nieuwe publishable keys (sb_publishable_…) alleen als apikey
      headers: { apikey: DB.anonKey, ...(DB.anonKey.startsWith('eyJ') ? { Authorization: `Bearer ${DB.anonKey}` } : {}), 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    const text = await res.text();
    if (!res.ok) { let m = text; try { m = JSON.parse(text).message || text; } catch {} throw new Error(m); }
    return text ? JSON.parse(text) : null;
  }
  const safeLink = l => /^https?:\/\//i.test(l || '') ? l : '';
  function parseWensen(md) {
    return md.replace(/<!--[\s\S]*?-->/g, '').split(/\r?\n/)
      .filter(l => /^\s*[-*]\s+\S/.test(l))
      .map(l => {
        const [titel = '', prijs = '', link = '', notitie = ''] = l.replace(/^\s*[-*]\s+/, '').split('|').map(s => s.trim());
        const fav = /^(★|\*)/.test(titel);
        return { titel: titel.replace(/^(★|\*)\s*/, ''), prijs, link: safeLink(link), notitie, fav };
      })
      .filter(w => w.titel);
  }
  async function loadAll() {
    PEOPLE.forEach(p => { wishes[p.id] = []; });
    if (DB) {
      try {
        const rows = await rpc('lijsten', { p_kijker: me?.id || null });
        rows.forEach(r => (wishes[r.eigenaar] ||= []).push({
          id: r.id, titel: r.titel, prijs: r.prijs || '', link: safeLink(r.link), notitie: r.notitie || '',
          fav: r.fav,
        }));
      } catch (e) { console.warn('Database niet bereikbaar:', e.message); }
    } else {
      await Promise.all(PEOPLE.map(async p => {
        try {
          const res = await fetch(`wensen/${p.id}.md`, { cache: 'no-store' });
          if (res.ok) wishes[p.id] = parseWensen(await res.text());
        } catch {}
      }));
    }
    PEOPLE.forEach((p, i) => { heroes[i].count = wishes[p.id].length; });
    document.getElementById('totaal').textContent = String(Object.values(wishes).reduce((a, l) => a + l.length, 0)).padStart(2, '0');
  }

  /* ================= Wie ben jij? (één keer kiezen, deze browser onthoudt het) ================= */
  const whoBtn = document.getElementById('who'), loginEl = document.getElementById('login');

  if (DB) { whoBtn.classList.remove('hidden'); renderWho(); }
  whoPick.innerHTML = PEOPLE.map(p => `<button type="button" data-id="${p.id}" aria-pressed="false">${p.naam}</button>`).join('');
  whoPick.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    me = { id: b.dataset.id };
    try { localStorage.setItem('wensbos-ik', JSON.stringify(me)); } catch {}
    sfx.coin(); renderWho(); closeLogin(); await afterAuthChange();
  });
  function openLogin() {
    whoPick.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === me?.id));
    document.getElementById('logout').classList.toggle('hidden', !me);

  function closeLogin() { loginEl.classList.add('hidden'); }
  whoBtn.addEventListener('click', openLogin);
  document.getElementById('loginCancel').addEventListener('click', closeLogin);
  document.getElementById('logout').addEventListener('click', async () => {
    me = null; try { localStorage.removeItem('wensbos-ik'); } catch {}

  });
  async function afterAuthChange() {
    await loadAll();
    if (state === 'level') { const i = PEOPLE.findIndex(p => `#/${p.id}` === location.hash); if (i >= 0) renderLevel(i); }
  }

  /* ================= Level-scherm (verlanglijstje) ================= */
  const level = document.getElementById('level');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  function itemActions(w, own) {
    const parts = [];
    if (w.link) parts.push(`<a class="btn go" href="${esc(w.link)}" target="_blank" rel="noopener noreferrer">BEKIJK ▶</a>`);

  function footer(p, own) {

          <h2>CADEAU TOEVOEGEN</h2>

    level.querySelector('#lvlWho')?.addEventListener('click', openLogin);

    level.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Dit cadeau van je lijstje halen?')) return;
      try { await rpc('cadeau_verwijderen', { p_lid: me.id, p_id: b.dataset.del }); sfx.back(); }

    }));

    if (form) form.addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(form), link = String(f.get('link') || '').trim();
      if (link && !safeLink(link)) { level.querySelector('#addErr').textContent = 'DE LINK MOET MET https:// BEGINNEN.'; return; }
      try {
        await rpc('cadeau_toevoegen', { p_lid: me.id, p_titel: String(f.get('titel')).trim(),
          p_prijs: String(f.get('prijs') || '').trim(), p_link: link, p_notitie: String(f.get('notitie') || '').trim(), p_fav: f.get('fav') === 'on' });

  let busy = false;
  async function openLevel(i, instant = false) {

  /* ================= Spelverloop ================= */
  let state = 'title', cam = 0, mouseX = 0.5, last = performance.now(), T = 0;
  const titleEl = document.getElementById('title'), hud = document.getElementById('hud'), hint = document.getElementById('hint');
  function showPlayUI() { titleEl.classList.add('hidden'); hud.classList.remove('hidden'); hint.classList.remove('hidden'); }
  function start() {
    if (state !== 'title') return;

  }
  function placeHeroesAtHome() { heroes.forEach(h => { h.x = h.home; h.walking = false; h.vy = 0; h.y = 0; }); }

  titleEl.addEventListener('click', start);
  addEventListener('keydown', e => {

    }
    if (state === 'title' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); }
    else if (state === 'play' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const n = selected < 0 ? 0 : (selected + (e.key === 'ArrowRight' ? 1 : -1) + heroes.length) % heroes.length;
      select(n, false); heroes[n].el.focus({ preventScroll: true });
    } else if (state === 'level' && e.key === 'Escape') closeLevel();
  });
  addEventListener('pointermove', e => { mouseX = e.clientX / innerWidth; });
  addEventListener('resize', resize);
  addEventListener('popstate', () => {
    const i = PEOPLE.findIndex(p => `#/${p.id}` === location.hash);
    if (i >= 0 && state === 'play') openLevel(i);
    else if (i >= 0 && state === 'level' && !busy) { selected = i; renderLevel(i); level.scrollTop = 0; }
    else if (i < 0 && state === 'level') closeLevel(true);
  });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    if (state === 'title') cam += 14 * dt;
    else if (state === 'intro') {
      cam += 40 * dt;
      if (heroes.every(h => h.x >= h.home - 1)) {
        state = 'play'; hint.style.opacity = 1;
        heroes.forEach(h => { h.walking = false; h.wait = 0.5 + Math.random() * 2; });
        setTimeout(() => { hint.style.opacity = 0; }, 5000);
      }
    }
    const camView = cam + (state === 'play' ? (mouseX - 0.5) * 24 : 0);
    updateHeroes(dt);
    if (state !== 'level') {
      drawWorld(T, camView);
      if (state !== 'title') drawHeroes(T);
      leaves.forEach((l, k) => {
        l.y += l.vy * dt; l.x += Math.sin(T * 2 + l.ph) * 8 * dt - 3 * dt;
        if (l.y > H || l.x < -4) leaves[k] = newLeaf(false);
        g.fillStyle = l.c; g.fillRect(Math.round(l.x), Math.round(l.y), Math.sin(T * 4 + l.ph) > 0 ? 2 : 1, 1);
      });
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('wereld').textContent = `1-${TH.nr} ${TH.naam}`;
  resize(); spawnLeaves();
  const loaded = loadAll();
  // direct naar een lijst via #/naam (deelbare link)
  const deep = PEOPLE.findIndex(p => `#/${p.id}` === location.hash);
  if (deep >= 0) {
    showPlayUI(); placeHeroesAtHome(); state = 'play'; hint.style.opacity = 0;
    loaded.then(() => openLevel(deep, true));
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
